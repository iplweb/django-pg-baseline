name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single source of truth for lint/format: .pre-commit-config.yaml.
  # CI runs the very same hooks (and therefore the very same pinned ruff)
  # that run locally on commit, so CI can never disagree with pre-commit
  # just because a new ruff was released. Bumping the version is a single
  # `pre-commit autoupdate` in one file.
  lint:
    name: lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: |
          python -m pip install --upgrade --quiet pip
          python -m pip install --quiet pre-commit
          pre-commit run --all-files --show-diff-on-failure --color=always

  unit:
    name: unit (py${{ matrix.python }} / dj${{ matrix.django }} / ${{ matrix.driver }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        django: ["5.1", "5.2", "6.1"]
        driver: ["psycopg2-binary", "psycopg[binary]>=3"]
        exclude:
          # Django 6.x requires Python >= 3.12.
          - python: "3.10"
            django: "6.1"
        include:
          - push-only: true
            python: "3.11"
            django: "5.0"
            driver: "psycopg[binary]>=3"
          - push-only: true
            python: "3.12"
            django: "5.1"
            driver: "psycopg2-binary"
          - push-only: true
            python: "3.12"
            django: "5.2"
            driver: "psycopg[binary]>=3"
          - push-only: true
            python: "3.12"
            django: "6.1"
            driver: "psycopg2-binary"

    steps:
      - uses: actions/checkout@v6

      - name: Skip push-only entries on PRs
        if: matrix.push-only && github.event_name == 'pull_request'
        run: |
          echo "Push-only matrix entry — skipping on PR."
          exit 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        env:
          DJANGO_VERSION: ${{ matrix.django }}
          DRIVER: ${{ matrix.driver }}
        run: |
          python -m pip install --upgrade --quiet pip
          python -m pip install --quiet -e ".[test]"
          python -m pip install --quiet "Django~=${DJANGO_VERSION}.0"
          # Quiesce the noisy "Skipping <pkg> as it is not installed" lines —
          # we deliberately uninstall every flavor regardless of which is
          # currently installed, then reinstall exactly the matrix one.
          python -m pip uninstall -y -q psycopg psycopg-binary psycopg2 psycopg2-binary 2>/dev/null || true
          python -m pip install --quiet "${DRIVER}"

      - name: Unit tests
        run: pytest -v

  integration:
    # Runs the docker-only test layer (rebuild + end-to-end fake project,
    # see SPEC §8 layer 2). Until those tests are written, the job
    # collects zero tests — pytest exits 5, which we treat as success.
    name: integration (rebuild + e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade --quiet pip
          python -m pip install --quiet -e ".[test]"

      - name: Run integration tests (allow exit 5 = no tests collected)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set +e
          pytest -v -m requires_docker
          rc=$?
          if [ $rc -eq 5 ]; then
            echo "::notice::No requires_docker tests collected — passing."
            exit 0
          fi
          exit $rc
